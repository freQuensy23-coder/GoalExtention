name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: python scripts/smoke-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-goal-extension
          path: dist/
          if-no-files-found: error
